  <!-- Person avatar -->
  <circle cx="400" cy="110" r="50" fill="white" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="400" cy="95" r="22" fill="#1a1a1a"/>
  <path d="M355 155 Q400 130 445 155" fill="#1a1a1a"/>
  <!-- Skills badges -->
