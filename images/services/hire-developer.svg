  <rect x="140" y="356" width="20" height="80" fill="#1a1a1a"/>
  <rect x="640" y="356" width="20" height="80" fill="#1a1a1a"/>
  <!-- Laptop -->
  <rect x="260" y="200" width="280" height="180" rx="8" fill="#1a1a1a"/>
